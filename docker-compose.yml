version: '3.8'

services:
  prompt-cache:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Provider selection
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai}
      
      # Provider API keys
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - MINIMAX_BASE_URL=${MINIMAX_BASE_URL:-https://api.minimax.io/v1}
      - MINIMAX_VERIFY_MODEL=${MINIMAX_VERIFY_MODEL:-MiniMax-M3.1-Flash}
      - OPENAI_EMBED_MODEL=${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      
      # Cache configuration (optional)
      - CACHE_HIGH_THRESHOLD=${CACHE_HIGH_THRESHOLD:-0.70}
      - CACHE_LOW_THRESHOLD=${CACHE_LOW_THRESHOLD:-0.30}
      - ENABLE_GRAY_ZONE_VERIFIER=${ENABLE_GRAY_ZONE_VERIFIER:-true}
    volumes:
      - ./badger_data:/app/badger_data
    restart: unless-stopped
